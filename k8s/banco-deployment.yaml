apiVersion: apps/v1
kind: Deployment
metadata:
  name: banco-udea
spec:
  replicas: 2
  selector:
    matchLabels:
      app: banco-udea
  template:
    metadata:
      labels:
        app: banco-udea
    spec:
      containers:
        - name: banco-udea
          image: dainxor/banco_udea:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/asl1?useSSL=false&allowPublicKeyRetrieval=true"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-password
