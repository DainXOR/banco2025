apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: banco2025
  namespace: argocd
spec:
  project: default

  source:
    repoURL: 'https://github.com/DainXOR/banco2025.git'
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
